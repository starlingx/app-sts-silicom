- hosts: all
  tasks:
    - name: Check UTCoverage directory exists
      stat:
        path: "{{ zuul.project.src_dir }}/python3-k8sapp-sts-silicom/k8sapp_sts_silicom/UTCoverage"
      register: utcoverage_stat

    - name: Upload coverage reports
      synchronize:
        src: "{{ zuul.project.src_dir }}/python3-k8sapp-sts-silicom/k8sapp_sts_silicom/UTCoverage/"
        dest: "{{ zuul.executor.log_root }}/coverage/"
        mode: pull
      when: utcoverage_stat.stat.exists
      failed_when: false

    - name: Return coverage report URL
      zuul_return:
        data:
          zuul:
            artifacts:
              - name: "Coverage Report"
                url: "coverage/htmlcov/index.html"
      when: utcoverage_stat.stat.exists
