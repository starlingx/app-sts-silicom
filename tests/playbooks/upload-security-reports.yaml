- hosts: all
  tasks:
    - name: Check UTCoverage directory exists
      stat:
        path: "{{ zuul.project.src_dir }}/python3-k8sapp-sts-silicom/k8sapp_sts_silicom/UTCoverage"
      register: utcoverage_stat

    - name: Upload security report
      synchronize:
        src: "{{ zuul.project.src_dir }}/python3-k8sapp-sts-silicom/k8sapp_sts_silicom/UTCoverage/security_report.txt"
        dest: "{{ zuul.executor.log_root }}/security_report.txt"
        mode: pull
      when: utcoverage_stat.stat.exists
      failed_when: false
