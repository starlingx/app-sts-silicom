[tox]
envlist = linters
minversion = 2.9
skipsdist = True
sitepackages=False

[testenv]
basepython = python3
install_command = pip install -U \
    {opts} {packages} \
    -c{env:TOX_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt}
setenv =
   VIRTUAL_ENV={envdir}
   OS_STDOUT_CAPTURE=1
   OS_STDERR_CAPTURE=1
   OS_DEBUG=1
   OS_LOG_CAPTURE=1
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
allowlist_externals =
  bash

[testenv:flake8]
basepython = python3
description = Dummy environment to allow flake8 to be run in subdir tox

[testenv:pylint]
basepython = python3
description = Dummy environment to allow pylint to be run in subdir tox

[testenv:metadata]
basepython = python3
description = Dummy environment to allow sysinv-app to be run in subdir tox

[testenv:bandit]
basepython = python3
description = Dummy environment to allow bandit to be run in subdir tox

[testenv:bashate]
# Treat all E* codes as Errors rather than warnings using: -e 'E*'
commands =
  bash -c "find {toxinidir}                    \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         -name \*.sh                          \
         -print0 | xargs -r -n 1 -0 bashate -v   \
         -e 'E*'"

[testenv:linters]
commands =
    {[testenv:bashate]commands}

[testenv:coverage]
install_command = pip install {opts} {packages}
deps = pytest
       pytest-cov
       mock
       PyYAML
allowlist_externals = bash
                      find
                      mkdir
commands =
  find . -type f -name "*.pyc" -delete
  mkdir -p {toxinidir}/UTCoverage
  bash -c "cd python3-k8sapp-sts-silicom/k8sapp_sts_silicom && \
    pytest k8sapp_sts_silicom/tests \
    --ignore=k8sapp_sts_silicom/tests/test_plugins.py \
    --ignore=k8sapp_sts_silicom/tests/test_sts_silicom.py \
    --cov=k8sapp_sts_silicom/common \
    --cov=k8sapp_sts_silicom/helm \
    --cov=k8sapp_sts_silicom/lifecycle \
    --cov=k8sapp_sts_silicom/kustomize \
    --cov-report=term-missing \
    --cov-report=html:{toxinidir}/UTCoverage/htmlcov \
    --cov-report=xml:{toxinidir}/UTCoverage/coverage.xml \
    --cov-fail-under=85 \
    -v --tb=short"

[testenv:security]
install_command = pip install {opts} {packages}
deps = bandit
allowlist_externals = bash
                      mkdir
commands =
  mkdir -p {toxinidir}/UTCoverage
  bash -c "cd python3-k8sapp-sts-silicom/k8sapp_sts_silicom && \
    bandit --ini tox.ini -n 5 -r k8sapp_sts_silicom \
    -f txt -o {toxinidir}/UTCoverage/security_report.txt"
  bash -c "cd python3-k8sapp-sts-silicom/k8sapp_sts_silicom && \
    bandit --ini tox.ini -n 5 -r k8sapp_sts_silicom \
    -f json -o {toxinidir}/UTCoverage/bandit-report.json"

[testenv:py313]
basepython = python3.13
description = Dummy environment to allow py313 to be run in subdir tox

[testenv:coverage-trixie]
description = Run coverage-trixie in subdir tox
allowlist_externals = bash
commands =
  bash -c "cd python3-k8sapp-sts-silicom/k8sapp_sts_silicom && tox -e coverage-trixie"

[testenv:security-trixie]
description = Run security-trixie in subdir tox
allowlist_externals = bash
commands =
  bash -c "cd python3-k8sapp-sts-silicom/k8sapp_sts_silicom && tox -e security-trixie"

[testenv:flake8-trixie]
description = Dummy environment to allow flake8-trixie to be run in subdir tox

[testenv:pylint-trixie]
description = Dummy environment to allow pylint-trixie to be run in subdir tox
